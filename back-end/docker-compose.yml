services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: my-custom-odoo-image
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: odoo
      DB_PASSWORD: odoo
    volumes:
      # volume để lưu data của Odoo (filestore, cấu hình…)
      - odoo-data:/var/lib/odoo
      # mount source code addons vào container để dev trực tiếp
      - ./odoo/addons:/mnt/extra-addons

volumes:
  odoo-db-data:
  odoo-data:
