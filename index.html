<!DOCTYPE html>
<html>

<body>
    <script>
        fetch("http://localhost:8080/api/auth/login", {
            method: "POST",
            credentials: "include", // this tests if cookies are allowed
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ username: "admin", password: "admin" })
        })
            .then(r => r.json())
            .then(data => console.log("✅ Success:", data))
            .catch(err => console.error("❌ Error:", err));

        // Read the session_id cookie and assign it to the header field
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        setTimeout(() => {
            const sessionId = getCookie('session_id');
            fetch("http://localhost:8080/api/hr/employees", {
            method: "GET",
            credentials: "include", // send cookies from previous login
            headers: sessionId ? { "session_id": sessionId } : {}
            })
            .then(r => r.json())
            .then(data => console.log("✅ Departments:", data))
            .catch(err => console.error("❌ Error:", err));
        }, 5000); // wait a second to ensure login is processed

    </script>
</body>

</html>
