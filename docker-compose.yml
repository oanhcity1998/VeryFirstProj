services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: ./back-end
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: odoo
      DB_PASSWORD: odoo
    volumes:
      # volume để lưu data của Odoo (filestore, cấu hình…)
      - odoo-data:/var/lib/odoo
      # mount source code addons vào container để dev trực tiếp
      - ./back-end/odoo/addons:/mnt/extra-addons
  nginx:
    image: nginx:1.27
    depends_on: [odoo]
    ports:
      - "8080:80"
    volumes:
      - ./back-end/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./front-end
    ports:
      - "3000:3000"
    depends_on:
      - odoo

volumes:
  odoo-db-data:
  odoo-data:
